[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hlaprotbert"
version = "1.0.0"
description = "HLA allele encoding using protein language models (ProtBERT, ESM, ProtT5, Ankh) for immunogenomics research"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Deniz Akdemir", email = "dakdemir@nmdp.org"}
]
maintainers = [
    {name = "Deniz Akdemir", email = "dakdemir@nmdp.org"}
]
keywords = [
    "HLA",
    "immunogenetics",
    "protein language models",
    "ProtBERT",
    "ESM",
    "ProtT5",
    "Ankh",
    "embeddings",
    "bioinformatics",
    "transplantation",
    "histocompatibility",
    "deep learning",
    "machine learning"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: English",
    "Typing :: Typed"
]

dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "torch>=1.7.0",
    "transformers>=4.30.0",
    "sentencepiece>=0.1.99",
    "scikit-learn>=0.24.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "pyyaml>=5.4.0",
    "tqdm>=4.60.0",
    "biopython>=1.78",
    "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "flake8>=4.0.0",
    "black>=22.0.0",
    "mypy>=0.950",
    "isort>=5.10.0",
    "pre-commit>=2.20.0"
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-autodoc-typehints>=1.12.0",
    "myst-parser>=0.15.0"
]
analysis = [
    "umap-learn>=0.5.0",
    "reportlab>=3.5.0"
]
nomenclature = [
    "pyard>=0.2.0"
]
all = [
    "hlaprotbert[dev,docs,analysis,nomenclature]"
]

[project.urls]
Homepage = "https://github.com/dakdemir-nmdp/hla-protbert"
Documentation = "https://github.com/dakdemir-nmdp/hla-protbert/tree/main/docs"
Repository = "https://github.com/dakdemir-nmdp/hla-protbert.git"
"Bug Tracker" = "https://github.com/dakdemir-nmdp/hla-protbert/issues"
Changelog = "https://github.com/dakdemir-nmdp/hla-protbert/blob/main/CHANGELOG.md"

[project.scripts]
hla-download-imgt = "hlaprotbert.scripts.download_imgt_data:main"
hla-update-imgt = "hlaprotbert.scripts.update_imgt:main"
hla-generate-embeddings = "hlaprotbert.scripts.generate_embeddings:main"
hla-analyze-locus = "hlaprotbert.scripts.analyze_locus_embeddings:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | venv
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "venv/",
    "build/",
    "dist/"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]
